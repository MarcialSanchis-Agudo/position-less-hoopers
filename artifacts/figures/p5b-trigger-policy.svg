<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="title desc">
  <title id="title">PLH P5b trigger policy comparison</title>
  <desc id="desc">Coordination recomputation counts and mean help-trigger latency across reactive, direct, and pressure-trigger policies.</desc>
  <rect width="100%" height="100%" fill="white"/>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #4b5563; }
    .axis { stroke: #9ca3af; stroke-width: 1; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .label { font-size: 12px; fill: #374151; }
    .small { font-size: 11px; fill: #4b5563; }
    .line { fill: none; stroke: #111827; stroke-width: 3; }
    .point { fill: #111827; }
    .bar-static { fill: #9ca3af; }
    .bar-capability { fill: #4b5563; }
    .bar-situated { fill: #111827; }
    .good { fill: #d1fae5; }
    .bad { fill: #fee2e2; }
    .neutral { fill: #f3f4f6; }
    .covered { fill: #d1fae5; stroke: #065f46; stroke-width: 2; }
    .degraded { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
    .uncovered { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
    .agent { fill: #f9fafb; stroke: #111827; stroke-width: 2; }
    .edge { stroke: #9ca3af; stroke-width: 2; }
  </style>
  
  <text class="title" x="80" y="42">P5b trigger policy comparison</text>
  <text class="subtitle" x="80" y="66">Three synthetic traces: coupled support signal, noise-only, and slow drift</text>
  <line class="axis" x1="80" y1="500" x2="940" y2="500"/>

  
      <rect x="165" y="454.5" width="48" height="45.5" fill="#4b5563"/>
      <rect x="228" y="500" width="48" height="0" fill="#9ca3af"/>
      <text class="small" text-anchor="middle" x="189" y="446.5">2</text>
      <text class="small" text-anchor="middle" x="252" y="492">0</text>
      <text class="label" text-anchor="middle" x="220" y="530">plh_direct</text>
      <text class="small" text-anchor="middle" x="220" y="550">mean help latency: 60s</text>
    
      <rect x="445" y="431.75" width="48" height="68.25" fill="#4b5563"/>
      <rect x="508" y="477.25" width="48" height="22.75" fill="#9ca3af"/>
      <text class="small" text-anchor="middle" x="469" y="423.75">3</text>
      <text class="small" text-anchor="middle" x="532" y="469.25">1</text>
      <text class="label" text-anchor="middle" x="500" y="530">plh_pressure</text>
      <text class="small" text-anchor="middle" x="500" y="550">mean help latency: 0s</text>
    
      <rect x="725" y="227" width="48" height="273" fill="#4b5563"/>
      <rect x="788" y="272.5" width="48" height="227.49999999999997" fill="#9ca3af"/>
      <text class="small" text-anchor="middle" x="749" y="219">12</text>
      <text class="small" text-anchor="middle" x="812" y="264.5">10</text>
      <text class="label" text-anchor="middle" x="780" y="530">react_every_event</text>
      <text class="small" text-anchor="middle" x="780" y="550">mean help latency: 0s</text>
    

  <rect x="300" y="558" width="15" height="15" fill="#4b5563"/>
  <text class="small" x="323" y="570">all recomputations</text>
  <rect x="510" y="558" width="15" height="15" fill="#9ca3af"/>
  <text class="small" x="533" y="570">unnecessary recomputations</text>
  
</svg>
