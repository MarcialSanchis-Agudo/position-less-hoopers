<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">CourtShift worker-loss visualization</title>
  <desc id="desc">Before-and-after view of agent coverage when an implementation worker is lost.</desc>
  <rect width="100%" height="100%" fill="white"/>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #4b5563; }
    .axis { stroke: #9ca3af; stroke-width: 1; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .label { font-size: 12px; fill: #374151; }
    .small { font-size: 11px; fill: #4b5563; }
    .line { fill: none; stroke: #111827; stroke-width: 3; }
    .point { fill: #111827; }
    .bar-static { fill: #9ca3af; }
    .bar-capability { fill: #4b5563; }
    .bar-situated { fill: #111827; }
    .good { fill: #d1fae5; }
    .bad { fill: #fee2e2; }
    .neutral { fill: #f3f4f6; }
    .covered { fill: #d1fae5; stroke: #065f46; stroke-width: 2; }
    .degraded { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
    .uncovered { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
    .agent { fill: #f9fafb; stroke: #111827; stroke-width: 2; }
    .edge { stroke: #9ca3af; stroke-width: 2; }
  </style>
  
  <text class="title" x="50" y="44">CourtShift P2 — worker loss changes coverage</text>
  <text class="subtitle" x="50" y="68">Same work state; one agent disappears between snapshots</text>
  
      <rect x="35" y="90" width="500" height="460" rx="18" fill="#f9fafb" stroke="#d1d5db"/>
      <text class="title" x="61" y="132">Before perturbation</text>
      <text class="small" x="61" y="154">agents</text>
      <text class="small" x="61" y="342">work</text>
      <line class="edge" x1="125" y1="204" x2="125" y2="352"/><line class="edge" x1="445" y1="204" x2="445" y2="352"/>
      
      <circle class="agent" cx="125" cy="170" r="34"/>
      <text class="label" text-anchor="middle" x="125" y="174">implement</text>
      <text class="small" text-anchor="middle" x="125" y="228">active</text>
    
      <circle class="agent" cx="445" cy="170" r="34"/>
      <text class="label" text-anchor="middle" x="445" y="174">verify</text>
      <text class="small" text-anchor="middle" x="445" y="228">active</text>
    
      
      <rect class="covered" x="60" y="356" width="130" height="68" rx="10"/>
      <text class="label" text-anchor="middle" x="125" y="385">implement</text>
      <text class="small" text-anchor="middle" x="125" y="404">covered</text>
      
      <rect class="covered" x="380" y="356" width="130" height="68" rx="10"/>
      <text class="label" text-anchor="middle" x="445" y="385">verify</text>
      <text class="small" text-anchor="middle" x="445" y="404">covered</text>
      
    
  
      <rect x="565" y="90" width="500" height="460" rx="18" fill="#f9fafb" stroke="#d1d5db"/>
      <text class="title" x="591" y="132">After worker loss</text>
      <text class="small" x="591" y="154">agents</text>
      <text class="small" x="591" y="342">work</text>
      <line class="edge" x1="655" y1="204" x2="655" y2="352"/><line class="edge" x1="975" y1="204" x2="975" y2="352"/>
      
      <circle class="agent" cx="655" cy="170" r="34"/>
      <text class="label" text-anchor="middle" x="655" y="174">implement</text>
      <text class="small" text-anchor="middle" x="655" y="228">stopped</text>
    
      <circle class="agent" cx="975" cy="170" r="34"/>
      <text class="label" text-anchor="middle" x="975" y="174">verify</text>
      <text class="small" text-anchor="middle" x="975" y="228">active</text>
    
      
      <rect class="uncovered" x="590" y="356" width="130" height="68" rx="10"/>
      <text class="label" text-anchor="middle" x="655" y="385">implement</text>
      <text class="small" text-anchor="middle" x="655" y="404">uncovered</text>
      
      <rect class="covered" x="910" y="356" width="130" height="68" rx="10"/>
      <text class="label" text-anchor="middle" x="975" y="385">verify</text>
      <text class="small" text-anchor="middle" x="975" y="404">covered</text>
      
    
  
</svg>
