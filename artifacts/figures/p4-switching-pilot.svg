<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">PLH P4 switching pilot</title>
  <desc id="desc">Comparison of switching count, unnecessary switching, and uncovered time after worker loss across three switching policies.</desc>
  <rect width="100%" height="100%" fill="white"/>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #4b5563; }
    .axis { stroke: #9ca3af; stroke-width: 1; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .label { font-size: 12px; fill: #374151; }
    .small { font-size: 11px; fill: #4b5563; }
    .line { fill: none; stroke: #111827; stroke-width: 3; }
    .point { fill: #111827; }
    .bar-static { fill: #9ca3af; }
    .bar-capability { fill: #4b5563; }
    .bar-situated { fill: #111827; }
    .good { fill: #d1fae5; }
    .bad { fill: #fee2e2; }
    .neutral { fill: #f3f4f6; }
    .covered { fill: #d1fae5; stroke: #065f46; stroke-width: 2; }
    .degraded { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
    .uncovered { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
    .agent { fill: #f9fafb; stroke: #111827; stroke-width: 2; }
    .edge { stroke: #9ca3af; stroke-width: 2; }
  </style>
  
  <text class="title" x="100" y="42">P4 switching pilot — recovery vs churn</text>
  <text class="subtitle" x="100" y="66">Same candidate-state trace under no-switch, greedy-switch, and PLH hysteresis</text>

  <text class="label" x="100" y="96">switch count / unnecessary switches</text>
  <line class="axis" x1="100" y1="510" x2="940" y2="510"/>

  
      <rect x="148" y="510" width="54" height="0" fill="#4b5563"/>
      <rect x="211" y="510" width="54" height="0" fill="#9ca3af"/>
      <rect x="274" y="342" width="54" height="168" fill="#111827"/>

      <text class="small" text-anchor="middle" x="175" y="502">0</text>
      <text class="small" text-anchor="middle" x="238" y="502">0</text>
      <text class="small" text-anchor="middle" x="301" y="334">60s</text>

      <text class="label" text-anchor="middle" x="220" y="540">no_switch</text>
      <text class="small" text-anchor="middle" x="220" y="560">
        final=a · operational=no
      </text>
    
      <rect x="428" y="342" width="54" height="168" fill="#4b5563"/>
      <rect x="491" y="398" width="54" height="112" fill="#9ca3af"/>
      <rect x="554" y="510" width="54" height="0" fill="#111827"/>

      <text class="small" text-anchor="middle" x="455" y="334">3</text>
      <text class="small" text-anchor="middle" x="518" y="390">2</text>
      <text class="small" text-anchor="middle" x="581" y="502">0s</text>

      <text class="label" text-anchor="middle" x="500" y="540">greedy_switch</text>
      <text class="small" text-anchor="middle" x="500" y="560">
        final=b · operational=yes
      </text>
    
      <rect x="708" y="454" width="54" height="56" fill="#4b5563"/>
      <rect x="771" y="510" width="54" height="0" fill="#9ca3af"/>
      <rect x="834" y="510" width="54" height="0" fill="#111827"/>

      <text class="small" text-anchor="middle" x="735" y="446">1</text>
      <text class="small" text-anchor="middle" x="798" y="502">0</text>
      <text class="small" text-anchor="middle" x="861" y="502">0s</text>

      <text class="label" text-anchor="middle" x="780" y="540">plh_hysteresis</text>
      <text class="small" text-anchor="middle" x="780" y="560">
        final=b · operational=yes
      </text>
    

  <rect x="245" y="578" width="15" height="15" fill="#4b5563"/>
  <text class="small" x="268" y="590">switch count</text>
  <rect x="390" y="578" width="15" height="15" fill="#9ca3af"/>
  <text class="small" x="413" y="590">unnecessary switches</text>
  <rect x="575" y="578" width="15" height="15" fill="#111827"/>
  <text class="small" x="598" y="590">uncovered after worker loss</text>
  
</svg>
