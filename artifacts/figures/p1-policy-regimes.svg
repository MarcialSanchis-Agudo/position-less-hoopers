<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">P1 policy regimes</title>
  <desc id="desc">Comparison of assignment policies under cheap and expensive context reload regimes.</desc>
  <rect width="100%" height="100%" fill="white"/>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #4b5563; }
    .axis { stroke: #9ca3af; stroke-width: 1; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .label { font-size: 12px; fill: #374151; }
    .small { font-size: 11px; fill: #4b5563; }
    .line { fill: none; stroke: #111827; stroke-width: 3; }
    .point { fill: #111827; }
    .bar-static { fill: #9ca3af; }
    .bar-capability { fill: #4b5563; }
    .bar-situated { fill: #111827; }
    .good { fill: #d1fae5; }
    .bad { fill: #fee2e2; }
    .neutral { fill: #f3f4f6; }
    .covered { fill: #d1fae5; stroke: #065f46; stroke-width: 2; }
    .degraded { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
    .uncovered { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
    .agent { fill: #f9fafb; stroke: #111827; stroke-width: 2; }
    .edge { stroke: #9ca3af; stroke-width: 2; }
  </style>
  
  <text class="title" x="90" y="42">P1 policy behavior changes with context cost</text>
  <text class="subtitle" x="90" y="66">Seeded synthetic team simulation; higher mean utility is better</text>
  <line class="axis" x1="90" y1="500" x2="920" y2="500"/>
  <rect class="bar-static" x="218" y="272.53070843261725" width="70" height="227.46929156738275"/>
    <text class="small" text-anchor="middle" x="253" y="264.53070843261725">0.718</text><rect class="bar-capability" x="300" y="170.83333333333331" width="70" height="329.1666666666667"/>
    <text class="small" text-anchor="middle" x="335" y="162.83333333333331">0.872</text><rect class="bar-situated" x="382" y="217.34820356686964" width="70" height="282.65179643313036"/>
    <text class="small" text-anchor="middle" x="417" y="209.34820356686964">0.802</text><rect class="bar-static" x="568" y="434.1666666666667" width="70" height="65.83333333333331"/>
    <text class="small" text-anchor="middle" x="603" y="426.1666666666667">0.474</text><rect class="bar-capability" x="650" y="334.4028531513449" width="70" height="165.5971468486551"/>
    <text class="small" text-anchor="middle" x="685" y="326.4028531513449">0.625</text><rect class="bar-situated" x="732" y="247.37959677601242" width="70" height="252.62040322398758"/>
    <text class="small" text-anchor="middle" x="767" y="239.37959677601242">0.756</text>
  <text class="label" text-anchor="middle" x="335" y="534">Cheap reload (0.03)</text><text class="label" text-anchor="middle" x="685" y="534">Expensive reload (0.40)</text>
  <rect class="bar-static" x="260" y="552" width="16" height="16"/>
  <text class="small" x="282" y="565">static</text><rect class="bar-capability" x="440" y="552" width="16" height="16"/>
  <text class="small" x="462" y="565">capability</text><rect class="bar-situated" x="620" y="552" width="16" height="16"/>
  <text class="small" x="642" y="565">capability + situated</text>
  
</svg>
