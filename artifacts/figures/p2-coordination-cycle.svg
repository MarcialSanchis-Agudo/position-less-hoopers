<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">PLH deterministic coordination cycle</title>
  <desc id="desc">Need-first coordination from authoritative state through temporary responsibility and evidence-gated satisfaction or reopening.</desc>
  <rect width="100%" height="100%" fill="white"/>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #4b5563; }
    .axis { stroke: #9ca3af; stroke-width: 1; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .label { font-size: 12px; fill: #374151; }
    .small { font-size: 11px; fill: #4b5563; }
    .line { fill: none; stroke: #111827; stroke-width: 3; }
    .point { fill: #111827; }
    .bar-static { fill: #9ca3af; }
    .bar-capability { fill: #4b5563; }
    .bar-situated { fill: #111827; }
    .good { fill: #d1fae5; }
    .bad { fill: #fee2e2; }
    .neutral { fill: #f3f4f6; }
    .covered { fill: #d1fae5; stroke: #065f46; stroke-width: 2; }
    .degraded { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
    .uncovered { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
    .agent { fill: #f9fafb; stroke: #111827; stroke-width: 2; }
    .edge { stroke: #9ca3af; stroke-width: 2; }
  </style>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <text class="title" x="50" y="42">PLH deterministic coordination cycle</text>
  <text class="subtitle" x="50" y="66">Responsibilities may end; unresolved Needs do not disappear.</text>

  
    <rect class="neutral" x="45" y="140" width="150" height="76" rx="14" stroke="#9ca3af" stroke-width="1.5"/>
    <text class="label" text-anchor="middle" x="120" y="171" font-weight="700">State</text>
    <text class="small" text-anchor="middle" x="120" y="192">authoritative</text>
  
  
    <rect class="neutral" x="235" y="140" width="170" height="76" rx="14" stroke="#9ca3af" stroke-width="1.5"/>
    <text class="label" text-anchor="middle" x="320" y="171" font-weight="700">NeedProposal</text>
    <text class="small" text-anchor="middle" x="320" y="192">non-authoritative</text>
  
  
    <rect class="covered" x="445" y="140" width="150" height="76" rx="14" stroke="#9ca3af" stroke-width="1.5"/>
    <text class="label" text-anchor="middle" x="520" y="171" font-weight="700">Need</text>
    <text class="small" text-anchor="middle" x="520" y="192">admitted + versioned</text>
  
  
    <rect class="neutral" x="635" y="140" width="165" height="76" rx="14" stroke="#9ca3af" stroke-width="1.5"/>
    <text class="label" text-anchor="middle" x="717.5" y="171" font-weight="700">Matcher</text>
    <text class="small" text-anchor="middle" x="717.5" y="192">capability + situation</text>
  
  
    <rect class="degraded" x="840" y="140" width="175" height="76" rx="14" stroke="#9ca3af" stroke-width="1.5"/>
    <text class="label" text-anchor="middle" x="927.5" y="171" font-weight="700">Responsibility</text>
    <text class="small" text-anchor="middle" x="927.5" y="192">temporary lease</text>
  

  
    <line x1="195" y1="178" x2="235" y2="178" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    
  
  
    <line x1="405" y1="178" x2="445" y2="178" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="small" text-anchor="middle" x="425" y="170">validate / dedupe</text>
  
  
    <line x1="595" y1="178" x2="635" y2="178" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    
  
  
    <line x1="800" y1="178" x2="840" y2="178" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    
  

  
    <rect class="neutral" x="840" y="300" width="175" height="76" rx="14" stroke="#9ca3af" stroke-width="1.5"/>
    <text class="label" text-anchor="middle" x="927.5" y="331" font-weight="700">Execution</text>
    <text class="small" text-anchor="middle" x="927.5" y="352">agent performs work</text>
  
  
    <rect class="neutral" x="620" y="300" width="180" height="76" rx="14" stroke="#9ca3af" stroke-width="1.5"/>
    <text class="label" text-anchor="middle" x="710" y="331" font-weight="700">Evidence check</text>
    <text class="small" text-anchor="middle" x="710" y="352">deterministic gate</text>
  
  
    <rect class="covered" x="360" y="420" width="190" height="76" rx="14" stroke="#9ca3af" stroke-width="1.5"/>
    <text class="label" text-anchor="middle" x="455" y="451" font-weight="700">Need satisfied</text>
    <text class="small" text-anchor="middle" x="455" y="472">terminal</text>
  
  
    <rect class="uncovered" x="670" y="420" width="190" height="76" rx="14" stroke="#9ca3af" stroke-width="1.5"/>
    <text class="label" text-anchor="middle" x="765" y="451" font-weight="700">Need reopened</text>
    <text class="small" text-anchor="middle" x="765" y="472">unresolved work survives</text>
  

  
    <line x1="927" y1="216" x2="927" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    
  
  
    <line x1="840" y1="338" x2="800" y2="338" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    
  
  
    <line x1="710" y1="376" x2="505" y2="420" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="small" text-anchor="middle" x="607.5" y="390">obligations met</text>
  
  
    <line x1="710" y1="376" x2="765" y2="420" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="small" text-anchor="middle" x="737.5" y="390">missing evidence</text>
  

  <path d="M 765 496 C 765 535, 520 535, 520 216" fill="none" stroke="#991b1b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text class="small" x="575" y="530">reassignment preserves Need identity</text>

  <text class="small" x="50" y="520">Fluid cognition; explicit authority; evidence-gated satisfaction.</text>
  
</svg>
